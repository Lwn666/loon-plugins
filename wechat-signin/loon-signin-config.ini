#!name=微信小程序会员商城签到
#!desc=zsvip.xomitoto.com 微信小程序每日自动签到。\n打开小程序时自动续期凭证，每天定时签到并推送通知。
#!author=Minis
#!icon=https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/97/40/5e/97405e49-87bb-3f0a-bf3a-91cf8fdf99a0/AppIcon-0-0-1x_U007epad-0-1-0-0-sRGB-GLES2_U002c0-85-220.png/144x144.png
#!tag=签到,微信
#!loon_version = 3.5.1(978)
#!arguments-desc=- 凭证自动捕获: 打开小程序时自动截获最新 third-session 并持久存储，强烈建议保持开启 \n\n- CRONEXP: 定时签到时间，默认每天 08:00，可自行配置如 "30 9 * * *" \n\n- DEBUG: 开启后控制台输出详细日志 \n\n- TIMEOUT: 脚本超时时间，默认 30 秒

[Argument]
CAPTURE_ENABLE=switch,true,tag=凭证自动捕获,desc=打开小程序时自动更新签到凭证
CRONEXP=input,0 8 * * *,tag=CRONEXP,desc=默认每天08:00执行,建议自行配置
DEBUG=switch,false,tag=调试模式,desc=开启后输出详细日志
TIMEOUT=input,30,type=number,tag=脚本超时秒数,desc=TIMEOUT

[General]

[Rule]

[Rewrite]

[Host]

[Mitm]
hostname = zsvip.xomitoto.com

[Script]
# 凭证捕获：小程序任意请求头中截获最新 third-session/userId
http-request ^https?:\/\/zsvip\.xomitoto\.com script-path=capture.js,tag=签到凭证捕获,requires-body=false,timeout=10,enable={CAPTURE_ENABLE},argument=[{DEBUG}]

# 定时签到（cron 表达式来自参数）
cron {CRONEXP} script-path=signin.js,tag=微信自动签到,timeout={TIMEOUT},enable=true,argument=[{DEBUG}]

# 手动触发（Loon App 内点击执行）
generic script-path=signin.js,tag=手动签到,timeout={TIMEOUT},enable=true,argument=[{DEBUG}]